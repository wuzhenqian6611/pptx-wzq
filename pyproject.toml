[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pptx-wzq"
version = "1.2.0"
description = "PPT 多模态教学知识库自动化构建：图片/公式/文本提取（含 vsdx 与矢量规范化、文本坐标）→ 图片AI解读 → 图文相关性过滤 → 教材文案（300字直出）→ 图文绑定（ID/坐标/逻辑关系/图片作用）→ 教材HTML/Deck；断点续传+日志"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Wu Zheqian" }]
keywords = ["pptx", "education", "knowledge-base", "multimodal", "latex", "ocr", "visio", "vsdx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "Pillow>=9.0",
    "openai>=1.0",
    "olefile>=0.46",
    "ultralytics>=8.0",
    "omml2latex>=0.1.1",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
ocr = ["pix2tex>=0.1.2"]
dev = ["pytest>=7.0"]

[project.scripts]
pptx-img = "pptx_wzq.cli_img:main"
pptx-formula = "pptx_wzq.cli_formula:main"
pptx-text = "pptx_wzq.cli_text:main"
pptx-caption = "pptx_wzq.cli_caption:main"
pptx-related = "pptx_wzq.cli_related:main"
pptx-author = "pptx_wzq.cli_author:main"
pptx-bind = "pptx_wzq.cli_bind:main"
pptx-paser = "pptx_wzq.cli_paser:main"
pptx-html = "pptx_wzq.gen_html:main"
pptx-deck = "pptx_wzq.build_deck:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pptx_wzq*"]

[tool.setuptools.package-data]
pptx_wzq = ["mtef_decoder/*.py", "weights/*.pt"]

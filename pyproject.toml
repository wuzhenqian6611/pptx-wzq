[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pptx-kb"
version = "1.0.0"
description = "PPT 多模态教学知识库自动化构建：图片/公式/文本提取 → 图片AI解读 → 教材文案 → 图文绑定 → 教材HTML/Deck"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Wu Zheqian" }]
keywords = ["pptx", "education", "knowledge-base", "multimodal", "latex", "ocr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "Pillow>=9.0",
    "openai>=1.0",
    "olefile>=0.46",
    "ultralytics>=8.0",
    "omml2latex>=0.1.1",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
ocr = ["pix2tex[latex]>=0.1.2"]
dev = ["pytest>=7.0"]

[project.scripts]
pptx-img = "pptx_kb.cli_img:main"
pptx-formula = "pptx_kb.cli_formula:main"
pptx-text = "pptx_kb.cli_text:main"
pptx-caption = "pptx_kb.cli_caption:main"
pptx-author = "pptx_kb.cli_author:main"
pptx-bind = "pptx_kb.cli_bind:main"
pptx-paser = "pptx_kb.cli_paser:main"
pptx-html = "pptx_kb.gen_html:main"
pptx-deck = "pptx_kb.build_deck:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pptx_kb*"]

[tool.setuptools.package-data]
pptx_kb = ["mtef_decoder/*.py"]
